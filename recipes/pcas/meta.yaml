{% set name = "pcas" %}
{% set version = "4.13.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/epics-modules/pcas/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5004e39339c8e592fcb9b4275c84143635c6e688c0fbe01f17dafe19850398a0

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - epics-base >=7
    - readline
  run:
    - epics-base >=7

test:
  commands:
    # these generate some files
    - aitGen ./test-aitGen
    - genApps ./test-genApps

about:
  home: https://github.com/epics-modules/pcas
  dev_url: https://github.com/epics-modules/pcas.git
  summary: C++ Portable Channel Access Server Library
  description: |
    EPICS Portable Channel Access Server and Generic Data Descriptor
    C++ libraries, split off from EPICS Base 3.16.1 as a separate
    module for EPICS 7.

extra:
  recipe-maintainers:
    - duncanmmacleod
